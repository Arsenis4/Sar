name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q SAR_EUR_Converter_Project.zip

      - name: Build APK
        run: gradle -p SAR_EUR_Converter assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAR-EUR-Converter
          path: SAR_EUR_Converter/app/build/outputs/apk/debug/app-debug.apk
